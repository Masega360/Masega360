<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 176" width="1000" height="176" role="img" aria-label="Languages across every repo I work on: Python 24%, TypeScript 22%, Java 16%, Go 15%, JavaScript 10%, Kotlin 6%, OpenSCAD 3%, Other 4%">
<style>
@font-face{font-family:'JBx';src:url(data:font/woff2;base64,) format('woff2');}
@font-face{font-family:'INBx';src:url(data:font/woff2;base64,) format('woff2');}
.f-SG{font-family:'SGx','Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif;}
.f-SGB{font-family:'SGBx','Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif;}
.f-IN{font-family:'INx',Inter,'Segoe UI',Helvetica,Arial,sans-serif;}
.f-INB{font-family:'INBx',Inter,'Segoe UI',Helvetica,Arial,sans-serif;}
.f-JB{font-family:'JBx','JetBrains Mono',Consolas,monospace;}
.f-JBB{font-family:'JBBx','JetBrains Mono',Consolas,monospace;}
.flow{fill:none;stroke:#79B4AE;stroke-width:1.5;stroke-dasharray:3 9;stroke-linecap:round;animation:flow 1.4s linear infinite;opacity:.9}
.flow.acc{stroke:#E2673F;} .flow.rev{animation-direction:reverse;}
.pulse{animation:pulse 2s ease-out infinite;transform-box:fill-box;transform-origin:center;}
.blink{animation:blink 1.1s steps(1) infinite;}
@keyframes flow{to{stroke-dashoffset:-24;}}
@keyframes pulse{0%{transform:scale(1);opacity:.8}80%,100%{transform:scale(2.8);opacity:0}}
@keyframes blink{50%{opacity:0;}}

@media (prefers-reduced-motion: reduce){*{animation:none !important;}}
</style>
