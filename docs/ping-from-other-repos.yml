# Copy into any repo as .github/workflows/ping-profile.yml
# so a push there refreshes the profile cards right away.
# Needs the same PROFILE_TOKEN secret in that repo (or at org level).
name: Ping profile
on:
  push:
    branches: [main]
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.PROFILE_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Masega360/Masega360/dispatches \
            -d '{"event_type":"refresh-profile"}'
